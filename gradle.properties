kotlin.code.style=official
org.gradle.jvmargs=-Dkotlin.daemon.jvm.options\="-Xmx8096M"
org.gradle.configuration-cache=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# Do not enable kotlin.internal.incremental.enableUnsafeOptimizationsForMultiplatform here.
# It lets a commonMain edit recompile a dependent platform compilation incrementally, which
# links the untouched commonMain files from their previous output. An expect class actualized
# by a typealias is already expanded there, so the recompiled file and the cached one disagree
# about the same type and the build fails with e.g. "actual type is 'RenderImage', but 'Bitmap'
# was expected" on androidMain. See https://youtrack.jetbrains.com/issue/KT-63353

# build variants that enables/disables variant specific features
# standalone, fdroid or play
snd.android.variant="standalone"